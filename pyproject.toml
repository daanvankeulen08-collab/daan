[project]
name = "mathematical-discovery-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.4.3",
    "sympy==1.14.0",
    "scipy==1.17.1",
    "pydantic==2.11.10",
    "httpx==0.28.1",
    "jsonschema==4.25.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'"]
